[project]
name = "gardentender-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyjwt[crypto]>=2.9",
    "pydantic-settings>=2.4",
    "anthropic>=0.40",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "tzdata>=2024.1",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "aiosqlite>=0.20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
